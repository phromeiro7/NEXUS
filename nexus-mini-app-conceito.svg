<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" fill="none">
  <rect width="1440" height="1050" rx="30" fill="#E9EFEB"/>
  <circle cx="1200" cy="160" r="240" fill="#DDE7E1"/>
  <circle cx="185" cy="870" r="190" fill="#F3E3D9"/>
  <text x="100" y="108" fill="#142D3A" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">NEXUS · MINI APP</text>
  <text x="100" y="161" fill="#142D3A" font-family="Arial, sans-serif" font-size="36" font-weight="700">Uma visão rápida do seu dia</text>
  <text x="100" y="198" fill="#52616A" font-family="Arial, sans-serif" font-size="18">O bot captura. O Mini App ajuda você a acompanhar e agir.</text>

  <!-- Device -->
  <rect x="481" y="245" width="478" height="752" rx="62" fill="#142D3A"/>
  <rect x="494" y="258" width="452" height="726" rx="51" fill="#F5F6F2"/>
  <rect x="630" y="270" width="180" height="27" rx="13.5" fill="#142D3A"/>
  <!-- Telegram-like top bar -->
  <rect x="494" y="313" width="452" height="62" fill="#FFFFFF"/>
  <path d="M517 344L530 331M517 344L530 357M517 344H536" stroke="#142D3A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="554" y="350" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Nexus</text>
  <text x="880" y="349" fill="#52616A" font-family="Arial, sans-serif" font-size="22">···</text>
  <line x1="494" y1="375" x2="946" y2="375" stroke="#E2E7E3"/>
  <!-- Header -->
  <g transform="translate(523 402)">
    <rect width="40" height="40" rx="12" fill="#142D3A"/>
    <path d="M11 29V11C11 9 13 8 15 10L25 22C27 24 29 23 29 21V11" stroke="#F5F6F2" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="33" cy="11" r="2.2" fill="#C05640"/>
  </g>
  <text x="576" y="424" fill="#52616A" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">TERÇA-FEIRA, 3 DE NOVEMBRO</text>
  <text x="523" y="475" fill="#142D3A" font-family="Arial, sans-serif" font-size="31" font-weight="700">Hoje</text>
  <text x="523" y="504" fill="#52616A" font-family="Arial, sans-serif" font-size="15">3 tarefas para acompanhar</text>
  <rect x="851" y="446" width="64" height="38" rx="19" fill="#F3E3D9"/>
  <text x="883" y="471" text-anchor="middle" fill="#142D3A" font-family="Arial, sans-serif" font-size="14" font-weight="700">3 itens</text>

  <!-- overdue section -->
  <text x="523" y="554" fill="#142D3A" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PRECISA DE ATENÇÃO</text>
  <rect x="523" y="572" width="394" height="94" rx="17" fill="#FFFFFF" stroke="#E2D8D2" stroke-width="1.5"/>
  <rect x="539" y="590" width="4" height="58" rx="2" fill="#C05640"/>
  <circle cx="565" cy="618" r="11" stroke="#C05640" stroke-width="2.2"/>
  <text x="589" y="612" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Separar documentos</text>
  <text x="589" y="638" fill="#8C4D3D" font-family="Arial, sans-serif" font-size="13">Atrasada · ontem</text>
  <path d="M885 613L892 620L885 627" stroke="#87938F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- today section -->
  <text x="523" y="711" fill="#142D3A" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">HOJE</text>
  <rect x="523" y="729" width="394" height="82" rx="17" fill="#FFFFFF" stroke="#E2E7E3" stroke-width="1.5"/>
  <circle cx="565" cy="770" r="11" stroke="#8B9993" stroke-width="2.2"/>
  <text x="589" y="763" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Buscar encomenda</text>
  <text x="589" y="788" fill="#52616A" font-family="Arial, sans-serif" font-size="13">14h · lembrete agendado</text>
  <path d="M885 762L892 769L885 776" stroke="#87938F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="523" y="821" width="394" height="82" rx="17" fill="#FFFFFF" stroke="#E2E7E3" stroke-width="1.5"/>
  <circle cx="565" cy="862" r="11" stroke="#8B9993" stroke-width="2.2"/>
  <text x="589" y="855" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Ligar para Ana</text>
  <text x="589" y="880" fill="#52616A" font-family="Arial, sans-serif" font-size="13">Sem horário definido</text>
  <path d="M885 854L892 861L885 868" stroke="#87938F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CTA -->
  <rect x="523" y="918" width="394" height="52" rx="17" fill="#142D3A"/>
  <circle cx="551" cy="944" r="10" fill="#C05640"/>
  <path d="M551 938V950M545 944H557" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="720" y="950" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">Adicionar tarefa</text>

  <!-- Editorial annotations -->
  <g transform="translate(1030 326)">
    <rect width="310" height="158" rx="20" fill="#FFFFFF"/>
    <circle cx="32" cy="34" r="14" fill="#F3E3D9"/>
    <text x="32" y="39" text-anchor="middle" fill="#142D3A" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
    <text x="58" y="39" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Prioridade sem ruído</text>
    <text x="28" y="78" fill="#52616A" font-family="Arial, sans-serif" font-size="14">Atrasos aparecem primeiro, com</text>
    <text x="28" y="101" fill="#52616A" font-family="Arial, sans-serif" font-size="14">rótulo e cor; o restante fica leve.</text>
    <text x="28" y="133" fill="#52616A" font-family="Arial, sans-serif" font-size="13">Não depender só do terracota.</text>
  </g>
  <g transform="translate(1030 512)">
    <rect width="310" height="158" rx="20" fill="#FFFFFF"/>
    <circle cx="32" cy="34" r="14" fill="#F3E3D9"/>
    <text x="32" y="39" text-anchor="middle" fill="#142D3A" font-family="Arial, sans-serif" font-size="13" font-weight="700">2</text>
    <text x="58" y="39" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Ação principal evidente</text>
    <text x="28" y="78" fill="#52616A" font-family="Arial, sans-serif" font-size="14">Um botão de captura sempre</text>
    <text x="28" y="101" fill="#52616A" font-family="Arial, sans-serif" font-size="14">acessível, sem formulário longo.</text>
    <text x="28" y="133" fill="#52616A" font-family="Arial, sans-serif" font-size="13">A conversa continua no bot.</text>
  </g>
  <g transform="translate(1030 698)">
    <rect width="310" height="158" rx="20" fill="#FFFFFF"/>
    <circle cx="32" cy="34" r="14" fill="#F3E3D9"/>
    <text x="32" y="39" text-anchor="middle" fill="#142D3A" font-family="Arial, sans-serif" font-size="13" font-weight="700">3</text>
    <text x="58" y="39" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Estados transparentes</text>
    <text x="28" y="78" fill="#52616A" font-family="Arial, sans-serif" font-size="14">“Lembrete agendado” diz o que</text>
    <text x="28" y="101" fill="#52616A" font-family="Arial, sans-serif" font-size="14">aconteceu, sem prometer leitura.</text>
    <text x="28" y="133" fill="#52616A" font-family="Arial, sans-serif" font-size="13">Detalhes e reagendamento ao tocar.</text>
  </g>
  <text x="1030" y="908" fill="#52616A" font-family="Arial, sans-serif" font-size="14">Conceito inicial · não representa o layout final</text>
</svg>
