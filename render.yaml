# Blueprint do Render: a API (Hono) como serviço web gratuito. Os segredos (sync: false) são preenchidos
# no painel do Render na criação; nada sensível fica no Git. Passo a passo: README, "Colocar no ar".
services:
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    # --prod=false: o runtime da API é o tsx, que está em devDependencies.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @aj/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        value: https://jowqlwoiwiiboxykixss.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: NexusAssitant_bot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # URL pública do site na Vercel (origem https, sem barra final): CORS da API e botão "Ver no Nexus".
      - key: WEB_ORIGIN
        sync: false
      - key: MINI_APP_URL
        sync: false
      # IDs numéricos do Telegram de quem pode criar convites, separados por vírgula.
      - key: ADMIN_TELEGRAM_USER_IDS
        sync: false
