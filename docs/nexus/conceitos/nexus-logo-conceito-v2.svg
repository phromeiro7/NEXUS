<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060" fill="none">
  <rect width="1500" height="1060" rx="28" fill="#F5F6F2"/>
  <text x="80" y="82" fill="#142D3A" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">NEXUS · ESTUDO DE LOGO 02</text>
  <text x="80" y="120" fill="#52616A" font-family="Arial, sans-serif" font-size="16">N contínuo refinado · o símbolo funciona primeiro sem o ponto</text>

  <!-- Main direction -->
  <g transform="translate(80 170)">
    <rect width="420" height="430" rx="24" fill="#FFFFFF" stroke="#D9E0DC" stroke-width="2"/>
    <text x="28" y="42" fill="#C05640" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">DIREÇÃO PRINCIPAL</text>
    <rect x="90" y="78" width="240" height="240" rx="58" fill="#142D3A"/>
    <path fill="none" d="M151 258V137C151 127 164 123 171 131L250 224C257 232 270 228 270 217V137" stroke="#F5F6F2" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="292" cy="137" r="10" fill="#C05640"/>
    <text x="210" y="351" text-anchor="middle" fill="#142D3A" font-family="Arial, sans-serif" font-size="17" font-weight="700">N de fluxo + ponto de destino</text>
    <text x="210" y="379" text-anchor="middle" fill="#52616A" font-family="Arial, sans-serif" font-size="14">o acento fica separado do traço</text>
    <text x="210" y="403" text-anchor="middle" fill="#52616A" font-family="Arial, sans-serif" font-size="14">para continuar legível em miniatura</text>
  </g>

  <!-- Monochrome -->
  <g transform="translate(540 170)">
    <rect width="420" height="430" rx="24" fill="#FFFFFF" stroke="#D9E0DC" stroke-width="2"/>
    <text x="28" y="42" fill="#C05640" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">VERSÃO MONOCROMÁTICA</text>
    <rect x="90" y="78" width="240" height="240" rx="58" fill="#E9EFEB"/>
    <path fill="none" d="M151 258V137C151 127 164 123 171 131L250 224C257 232 270 228 270 217V137" stroke="#142D3A" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="292" cy="137" r="10" fill="#142D3A"/>
    <text x="210" y="351" text-anchor="middle" fill="#142D3A" font-family="Arial, sans-serif" font-size="17" font-weight="700">marca em uma só cor</text>
    <text x="210" y="379" text-anchor="middle" fill="#52616A" font-family="Arial, sans-serif" font-size="14">forma reconhecível sem depender</text>
    <text x="210" y="403" text-anchor="middle" fill="#52616A" font-family="Arial, sans-serif" font-size="14">do acento terracota</text>
  </g>

  <!-- Light avatar -->
  <g transform="translate(1000 170)">
    <rect width="420" height="430" rx="24" fill="#FFFFFF" stroke="#D9E0DC" stroke-width="2"/>
    <text x="28" y="42" fill="#C05640" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">AVATAR · FUNDO CLARO</text>
    <rect x="120" y="78" width="180" height="180" rx="54" fill="#FFFFFF" stroke="#D9E0DC" stroke-width="2"/>
    <path fill="none" d="M164 218V126C164 118 174 115 179 121L239 190C245 197 255 193 255 185V126" stroke="#142D3A" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="273" cy="126" r="8" fill="#C05640"/>
    <text x="210" y="296" text-anchor="middle" fill="#142D3A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Teste 24 · 32 · 40 · 48 px</text>
    <g transform="translate(82 326)">
      <rect width="64" height="64" rx="19" fill="#142D3A"/>
      <path fill="none" d="M17 49V16C17 13 21 12 23 14L42 36C44 38 48 37 48 34V16" stroke="#F5F6F2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="54" cy="16" r="3.2" fill="#C05640"/>
    </g>
    <text x="164" y="365" fill="#52616A" font-family="Arial, sans-serif" font-size="13">Ícone sem lettering</text>
    <text x="164" y="386" fill="#52616A" font-family="Arial, sans-serif" font-size="13">com área segura para recorte</text>
  </g>

  <!-- Wordmark lockup -->
  <rect x="80" y="650" width="1340" height="330" rx="24" fill="#142D3A"/>
  <text x="118" y="700" fill="#F0B39A" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">APLICAÇÃO DA MARCA</text>
  <g transform="translate(160 755)">
    <rect width="98" height="98" rx="28" fill="#F5F6F2"/>
    <path fill="none" d="M28 72V27C28 22 34 20 37 24L64 57C67 61 72 59 72 54V27" stroke="#142D3A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="27" r="4.5" fill="#C05640"/>
  </g>
  <text x="300" y="817" fill="#F5F6F2" font-family="Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="-3">nexus</text>
  <text x="304" y="858" fill="#B8C9C5" font-family="Arial, sans-serif" font-size="17">sua rotina, conectada</text>
  <line x1="814" y1="730" x2="814" y2="920" stroke="#35505A" stroke-width="2"/>
  <text x="866" y="780" fill="#F5F6F2" font-family="Arial, sans-serif" font-size="20" font-weight="700">O que mudou</text>
  <text x="866" y="824" fill="#D7E2DE" font-family="Arial, sans-serif" font-size="16">• N com hastes mais firmes e diagonal limpa</text>
  <text x="866" y="858" fill="#D7E2DE" font-family="Arial, sans-serif" font-size="16">• Ponto destacado com espaço ao redor</text>
  <text x="866" y="892" fill="#D7E2DE" font-family="Arial, sans-serif" font-size="16">• Contraste em claro, escuro e uma cor</text>
  <text x="866" y="926" fill="#F0B39A" font-family="Arial, sans-serif" font-size="14">Conceito para revisão — ainda não é arte final</text>
</svg>
