<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" fill="none">
  <rect width="1500" height="1080" rx="30" fill="#E9EFEB"/>
  <circle cx="1290" cy="160" r="250" fill="#DDE7E1"/>
  <circle cx="155" cy="990" r="190" fill="#F3E3D9"/>
  <text x="90" y="86" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">NEXUS · MINI APP</text>
  <text x="90" y="137" fill="#142D3A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Refino da tela “Hoje”</text>
  <text x="90" y="174" fill="#52616A" font-family="Arial, sans-serif" font-size="17">Mais claro para ler, tocar e entender o que aconteceu com cada lembrete.</text>

  <!-- Device mockup at narrow viewport -->
  <rect x="100" y="216" width="444" height="790" rx="52" fill="#142D3A"/>
  <rect x="112" y="228" width="420" height="766" rx="42" fill="#F5F6F2"/>
  <rect x="248" y="238" width="148" height="22" rx="11" fill="#142D3A"/>
  <!-- App-owned header -->
  <g transform="translate(136 278)">
    <rect width="42" height="42" rx="13" fill="#142D3A"/>
    <path fill="none" d="M12 30V12C12 9 15 8 17 11L26 22C28 25 31 23 31 20V12" stroke="#F5F6F2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="12" r="2.4" fill="#C05640"/>
  </g>
  <text x="190" y="295" fill="#142D3A" font-family="Arial, sans-serif" font-size="17" font-weight="700">nexus</text>
  <text x="190" y="315" fill="#52616A" font-family="Arial, sans-serif" font-size="12">Seu dia, em ordem</text>
  <rect x="454" y="277" width="48" height="48" rx="15" fill="#FFFFFF" stroke="#6F7E78" stroke-width="2"/>
  <circle cx="478" cy="291" r="2.2" fill="#142D3A"/><circle cx="478" cy="301" r="2.2" fill="#142D3A"/><circle cx="478" cy="311" r="2.2" fill="#142D3A"/>

  <!-- day heading -->
  <text x="136" y="367" fill="#52616A" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TERÇA-FEIRA · 3 NOV</text>
  <text x="136" y="411" fill="#142D3A" font-family="Arial, sans-serif" font-size="30" font-weight="700">Hoje</text>
  <text x="136" y="438" fill="#52616A" font-family="Arial, sans-serif" font-size="14">3 tarefas no total</text>

  <!-- overdue section -->
  <text x="136" y="483" fill="#142D3A" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ATRASADAS · 1</text>
  <rect x="128" y="495" width="372" height="94" rx="16" fill="#FFFFFF"/>
  <rect x="128" y="495" width="4" height="94" rx="2" fill="#C05640"/>
  <rect x="140" y="518" width="48" height="48" rx="15" fill="#FFFFFF" stroke="#6F7E78" stroke-width="2"/>
  <circle cx="164" cy="542" r="10" stroke="#6F7E78" stroke-width="2"/>
  <text x="202" y="530" fill="#142D3A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Separar documentos</text>
  <text x="202" y="555" fill="#8C4D3D" font-family="Arial, sans-serif" font-size="13">Atrasada desde ontem</text>
  <path fill="none" d="M469 536L476 543L469 550" stroke="#52616A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- today section -->
  <text x="136" y="626" fill="#142D3A" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HOJE · 2</text>
  <rect x="128" y="638" width="372" height="91" rx="16" fill="#FFFFFF"/>
  <rect x="140" y="659" width="48" height="48" rx="15" fill="#FFFFFF" stroke="#6F7E78" stroke-width="2"/>
  <circle cx="164" cy="683" r="10" stroke="#6F7E78" stroke-width="2"/>
  <text x="202" y="673" fill="#142D3A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Buscar encomenda</text>
  <text x="202" y="698" fill="#52616A" font-family="Arial, sans-serif" font-size="13">Hoje, às 14h · agendado</text>
  <path fill="none" d="M469 678L476 685L469 692" stroke="#52616A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="128" y="740" width="372" height="91" rx="16" fill="#FFFFFF"/>
  <rect x="140" y="761" width="48" height="48" rx="15" fill="#FFFFFF" stroke="#6F7E78" stroke-width="2"/>
  <circle cx="164" cy="785" r="10" stroke="#6F7E78" stroke-width="2"/>
  <text x="202" y="775" fill="#142D3A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Ligar para Ana</text>
  <text x="202" y="800" fill="#52616A" font-family="Arial, sans-serif" font-size="13">Sem horário definido</text>
  <path fill="none" d="M469 780L476 787L469 794" stroke="#52616A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Primary CTA -->
  <rect x="128" y="850" width="372" height="58" rx="17" fill="#142D3A"/>
  <circle cx="162" cy="879" r="11" fill="#C05640"/>
  <path fill="none" d="M162 873V885M156 879H168" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="319" y="885" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">Adicionar tarefa</text>

  <!-- Focus preview -->
  <rect x="124" y="846" width="380" height="66" rx="21" stroke="#C05640" stroke-width="3"/>
  <path fill="none" d="M475 914H515" stroke="#C05640" stroke-width="2"/>
  <text x="518" y="920" fill="#8C4D3D" font-family="Arial, sans-serif" font-size="12" font-weight="700">FOCO VISÍVEL</text>

  <!-- Task detail panel -->
  <rect x="604" y="216" width="430" height="790" rx="28" fill="#FFFFFF"/>
  <text x="642" y="266" fill="#8C4D3D" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AO ABRIR UMA TAREFA</text>
  <text x="642" y="310" fill="#142D3A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Detalhe + ações</text>
  <line x1="642" y1="334" x2="996" y2="334" stroke="#D9E0DC" stroke-width="2"/>
  <text x="642" y="381" fill="#52616A" font-family="Arial, sans-serif" font-size="13" font-weight="700">TAREFA</text>
  <text x="642" y="416" fill="#142D3A" font-family="Arial, sans-serif" font-size="20" font-weight="700">Buscar encomenda</text>
  <rect x="642" y="440" width="202" height="42" rx="14" fill="#F5F6F2"/>
  <circle cx="662" cy="461" r="6" fill="#C05640"/>
  <text x="678" y="466" fill="#142D3A" font-family="Arial, sans-serif" font-size="13" font-weight="700">Hoje, às 14h</text>
  <text x="642" y="526" fill="#52616A" font-family="Arial, sans-serif" font-size="13" font-weight="700">LEMBRETE</text>
  <text x="642" y="552" fill="#142D3A" font-family="Arial, sans-serif" font-size="14">Agendado para ser enviado pelo Telegram.</text>
  <text x="642" y="575" fill="#52616A" font-family="Arial, sans-serif" font-size="13">“Enviado” não significa que foi lido.</text>

  <!-- Touch targets -->
  <text x="642" y="633" fill="#52616A" font-family="Arial, sans-serif" font-size="13" font-weight="700">AÇÕES</text>
  <rect x="642" y="650" width="354" height="56" rx="16" fill="#142D3A"/>
  <path fill="none" d="M669 678L677 686L692 669" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="818" y="685" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="700">Concluir tarefa</text>
  <rect x="642" y="719" width="354" height="56" rx="16" fill="#FFFFFF" stroke="#6F7E78" stroke-width="2"/>
  <path fill="none" d="M674 747V739M674 739L668 745M674 739L680 745M674 747C674 754 681 757 686 753" stroke="#142D3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="818" y="754" text-anchor="middle" fill="#142D3A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Adiar 1 hora</text>
  <rect x="642" y="788" width="354" height="56" rx="16" fill="#FFFFFF" stroke="#6F7E78" stroke-width="2"/>
  <path fill="none" d="M669 817L682 804M669 817L679 817L679 807" stroke="#142D3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="818" y="823" text-anchor="middle" fill="#142D3A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Editar ou reagendar</text>
  <rect x="642" y="862" width="354" height="3" rx="1.5" fill="#E9EFEB"/>
  <text x="642" y="902" fill="#52616A" font-family="Arial, sans-serif" font-size="13">Ações são botões grandes; não dependem de gesto.</text>
  <text x="642" y="926" fill="#52616A" font-family="Arial, sans-serif" font-size="13">Controles com rótulo e foco de teclado visível.</text>

  <!-- Accessibility notes -->
  <g transform="translate(1080 256)">
    <rect width="330" height="198" rx="22" fill="#FFFFFF"/>
    <text x="28" y="42" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Ajustes de acessibilidade</text>
    <text x="28" y="82" fill="#52616A" font-family="Arial, sans-serif" font-size="14">• Áreas de toque com pelo menos 48 px</text>
    <text x="28" y="111" fill="#52616A" font-family="Arial, sans-serif" font-size="14">• Estado escrito, além da cor</text>
    <text x="28" y="140" fill="#52616A" font-family="Arial, sans-serif" font-size="14">• Contornos e foco mais visíveis</text>
    <text x="28" y="169" fill="#52616A" font-family="Arial, sans-serif" font-size="14">• Texto que pode quebrar linha</text>
  </g>
  <g transform="translate(1080 480)">
    <rect width="330" height="198" rx="22" fill="#FFFFFF"/>
    <text x="28" y="42" fill="#142D3A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Contrastes da proposta</text>
    <text x="28" y="82" fill="#52616A" font-family="Arial, sans-serif" font-size="14">Texto escuro / branco: ≥ 6,4:1</text>
    <text x="28" y="111" fill="#52616A" font-family="Arial, sans-serif" font-size="14">Texto escuro / fundo: ≥ 5,9:1</text>
    <text x="28" y="140" fill="#52616A" font-family="Arial, sans-serif" font-size="14">Terracota / branco: 4,52:1*</text>
    <text x="28" y="169" fill="#52616A" font-family="Arial, sans-serif" font-size="12">*Usado em texto só sobre branco.</text>
  </g>
  <g transform="translate(1080 704)">
    <rect width="330" height="202" rx="22" fill="#142D3A"/>
    <text x="28" y="44" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">Ainda precisa validar</text>
    <text x="28" y="86" fill="#E4ECE8" font-family="Arial, sans-serif" font-size="14">Esta imagem é um conceito, não uma</text>
    <text x="28" y="110" fill="#E4ECE8" font-family="Arial, sans-serif" font-size="14">auditoria do app implementado.</text>
    <text x="28" y="148" fill="#E4ECE8" font-family="Arial, sans-serif" font-size="14">Testar no Telegram: zoom, tema, teclado,</text>
    <text x="28" y="172" fill="#E4ECE8" font-family="Arial, sans-serif" font-size="14">leitor de tela e largura de 320 px.</text>
  </g>
  <text x="1080" y="954" fill="#52616A" font-family="Arial, sans-serif" font-size="13">Direção visual · WCAG 2.2 AA como referência</text>
</svg>
